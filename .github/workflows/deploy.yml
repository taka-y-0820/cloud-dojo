name: Deploy to Production

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.REGISTRY_URL }}/cloud-dojo/frontend:${{ steps.version.outputs.VERSION }}
            ${{ secrets.REGISTRY_URL }}/cloud-dojo/frontend:latest

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: ./backend/api
          push: true
          tags: |
            ${{ secrets.REGISTRY_URL }}/cloud-dojo/api:${{ steps.version.outputs.VERSION }}
            ${{ secrets.REGISTRY_URL }}/cloud-dojo/api:latest

      - name: Build and push worker
        uses: docker/build-push-action@v5
        with:
          context: ./backend/worker
          push: true
          tags: |
            ${{ secrets.REGISTRY_URL }}/cloud-dojo/worker:${{ steps.version.outputs.VERSION }}
            ${{ secrets.REGISTRY_URL }}/cloud-dojo/worker:latest

      - name: Deploy to Kubernetes
        run: |
          echo "Deployment step - configure with your K8s cluster"
          # kubectl set image deployment/frontend frontend=${{ secrets.REGISTRY_URL }}/cloud-dojo/frontend:${{ steps.version.outputs.VERSION }}
          # kubectl set image deployment/api api=${{ secrets.REGISTRY_URL }}/cloud-dojo/api:${{ steps.version.outputs.VERSION }}
          # kubectl set image deployment/worker worker=${{ secrets.REGISTRY_URL }}/cloud-dojo/worker:${{ steps.version.outputs.VERSION }}
