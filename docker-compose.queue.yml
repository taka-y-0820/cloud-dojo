version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: cloud-dojo-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - redis-network

volumes:
  redis-data:

networks:
  redis-network:
    driver: bridge
